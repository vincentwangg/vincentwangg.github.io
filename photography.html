<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>VINCENT WANG | Art & Photography</title>
      <link rel="stylesheet" href="css/art_style.css" />
   </head>
   <body>
      <header class="site-header">
        <div class="logo" style="font-weight: 400; letter-spacing: 0.04em">VINCENT WANG</div>

        <nav class="nav">
          <a href="art.html">Art</a>

          <div class="nav-item dropdown">
            <a href="photography.html" class="active">Photography</a>
            <div class="dropdown-menu">
              <a href="photography.html">General</a>
              <a href="photo-sports.html">Sports</a>
            </div>
          </div>
        </nav>
      </header>

  <main id="home">
    <section class="hero">
      <img src="assets/photo-hero1.png" alt="Featured artwork or photography" />
    </section>

    <section id="art" class="gallery-section">
      <div class="section-head">
        <h2>Random</h2>
        <p>Cool pics I like to take</p>
      </div>

      <div class="gallery">
        <div class="gallery-item landscape">
          <img src="assets/photo/el-capitan.jpg" loading="lazy" data-caption="El Capitan" style="object-position: center 20%;"/>
        </div>
        <div class="gallery-item landscape">
          <img src="assets/photo/stairs.jpg" loading="lazy" />
        </div>
        <div class="gallery-item landscape">
          <img src="assets/photo/fisher.jpg" loading="lazy" />
        </div>
        <div class="gallery-item landscape">
          <img src="assets/photo/moody-stairs.jpg" loading="lazy" />
        </div>
        <div class="gallery-item landscape">
          <img src="assets/photo/clouds.jpg" loading="lazy" />
        </div>
      </div>
    </section>
  </main>
      <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>

        <div class="lightbox-content">
          <img class="lightbox-image" id="lightbox-image" src="" alt="" />
          <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>
      </div>
      <script>
         const lightbox = document.getElementById("lightbox");
         const lightboxImage = document.getElementById("lightbox-image");
         const closeBtn = document.getElementById("lightbox-close");
         const galleryImages = document.querySelectorAll(".gallery-item img");
         const caption = document.getElementById("lightbox-caption");
         
         galleryImages.forEach((img) => {
           img.addEventListener("click", () => {
             lightboxImage.src = img.src;
             lightboxImage.alt = img.alt;
             caption.textContent = img.dataset.caption || "";
             lightbox.classList.add("active");
           });
         });
         
         closeBtn.addEventListener("click", () => {
           lightbox.classList.remove("active");
           lightboxImage.src = "";
           caption.textContent = "";
         });
         
         lightbox.addEventListener("click", (e) => {
           if (e.target === lightbox) {
             lightbox.classList.remove("active");
             lightboxImage.src = "";
           }
         });
         
         document.addEventListener("keydown", (e) => {
           if (e.key === "Escape") {
             lightbox.classList.remove("active");
             lightboxImage.src = "";
           }
         });
      </script>
</body>
</html>
