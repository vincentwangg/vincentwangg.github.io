<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>VINCENT WANG | Art & Photography</title>
      <link rel="stylesheet" href="css/art_style.css" />
   </head>
   <body>
      <header class="site-header">
         <div class="logo" style="font-weight: 400; letter-spacing: 0.04em">VINCENT WANG</div>
         <nav class="nav">
            <a href="art.html">Art</a>
            <a href="photography.html" class="active">Photography</a>
         </nav>
      </header>

  <main id="home">
    <section class="hero">
      <img src="assets/photo-hero1.png" alt="Featured artwork or photography" />
    </section>

    <section id="art" class="gallery-section">
      <div class="section-head">
        <h2>Artwork</h2>
        <p>Illustration, character work, environments, and experiments.</p>
      </div>

      <div class="gallery masonry">
        <a href="assets/art/art1.jpg" class="gallery-item tall" target="_blank">
          <img src="assets/art/art1.jpg" alt="Artwork 1" loading="lazy" />
        </a>
        <a href="assets/art/art2.jpg" class="gallery-item wide" target="_blank">
          <img src="assets/art/art2.jpg" alt="Artwork 2" loading="lazy" />
        </a>
        <a href="assets/art/art3.jpg" class="gallery-item" target="_blank">
          <img src="assets/art/art3.jpg" alt="Artwork 3" loading="lazy" />
        </a>
        <a href="assets/art/art4.jpg" class="gallery-item" target="_blank">
          <img src="assets/art/art4.jpg" alt="Artwork 4" loading="lazy" />
        </a>
        <a href="assets/art/art5.jpg" class="gallery-item tall" target="_blank">
          <img src="assets/art/art5.jpg" alt="Artwork 5" loading="lazy" />
        </a>
        <a href="assets/art/art6.jpg" class="gallery-item wide" target="_blank">
          <img src="assets/art/art6.jpg" alt="Artwork 6" loading="lazy" />
        </a>
      </div>
    </section>

    <section id="photo" class="gallery-section alt-bg">
      <div class="section-head">
        <h2>Photography</h2>
        <p>Street, landscapes, travel, and everyday light.</p>
      </div>

      <div class="gallery standard-grid">
        <a href="assets/photo/photo1.jpg" class="gallery-item" target="_blank">
          <img src="assets/photo/photo1.jpg" alt="Photo 1" loading="lazy" />
        </a>
        <a href="assets/photo/photo2.jpg" class="gallery-item" target="_blank">
          <img src="assets/photo/photo2.jpg" alt="Photo 2" loading="lazy" />
        </a>
        <a href="assets/photo/photo3.jpg" class="gallery-item" target="_blank">
          <img src="assets/photo/photo3.jpg" alt="Photo 3" loading="lazy" />
        </a>
        <a href="assets/photo/photo4.jpg" class="gallery-item" target="_blank">
          <img src="assets/photo/photo4.jpg" alt="Photo 4" loading="lazy" />
        </a>
      </div>
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <p>
        I use this space to share hobby work in art and photography.
        This page is built with simple HTML and CSS for GitHub Pages.
      </p>
    </section>
  </main>
</body>
</html>
