<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>VINCENT WANG | Volleyball Photography</title>
      <link rel="stylesheet" href="css/art_style.css" />
   </head>
   <body class="volleyball-photo">
      <header class="site-header">
        <div class="logo" style="font-weight: 400; letter-spacing: 0.04em">VINCENT WANG</div>

        <nav class="nav">
          <a href="art.html">Art</a>

          <div class="nav-item dropdown">
            <a href="photography.html" class="active">Photography</a>
            <div class="dropdown-menu">
              <a href="photography.html">General</a>
              <a href="volleyball-photo.html">Volleyball</a>
            </div>
          </div>
        </nav>
      </header>

      <main id="home">
        <section class="hero">
          <picture>
            <source media="(max-width: 768px)" srcset="assets/volleyball/hero_mobile.jpg">
            <img src="assets/volleyball/hero.jpg" alt="Featured artwork or photography" />
          </picture>
        </section>
         <div class="scroll-indicator">
          <a href="#gallery">
            <span>View Work</span>
            <div class="arrow"></div>
          </a>
        </div>
         <section id="gallery" class="gallery-section">
            <div class="section-head">
               <h2 style="font-weight: 400; letter-spacing: 0.02em">Action</h2>
            </div>
            <div class="gallery">
              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-47.jpg" loading="lazy" style="object-position: center 10%;"/>
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-45.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-25.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-21.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-8.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-34.jpg" loading="lazy" />
              </div>
            </div>
            <div class="section-head">
               <h2 style="font-weight: 400; letter-spacing: 0.02em; padding-top: 10vh;">Team Energy</h2>
            </div>
            <div class="gallery">
              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-1.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-18.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-16.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-9.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-30.jpg" loading="lazy" />
              </div>

              <div class="gallery-item landscape">
                <img src="assets/volleyball/losgatosvball-apr16-44.jpg" loading="lazy" />
              </div>
            </div>
         </section>
      </main>
      <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>

        <div class="lightbox-content">
          <img class="lightbox-image" id="lightbox-image" src="" alt="" />
          <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>
      </div>
      <script>
         const lightbox = document.getElementById("lightbox");
         const lightboxImage = document.getElementById("lightbox-image");
         const closeBtn = document.getElementById("lightbox-close");
         const galleryImages = document.querySelectorAll(".gallery-item img");
         const caption = document.getElementById("lightbox-caption");
         
         galleryImages.forEach((img) => {
           img.addEventListener("click", () => {
             lightboxImage.src = img.src;
             lightboxImage.alt = img.alt;
             caption.textContent = img.dataset.caption || "";
             lightbox.classList.add("active");
           });
         });
         
         closeBtn.addEventListener("click", () => {
           lightbox.classList.remove("active");
           lightboxImage.src = "";
           caption.textContent = "";
         });
         
         lightbox.addEventListener("click", (e) => {
           if (e.target === lightbox) {
             lightbox.classList.remove("active");
             lightboxImage.src = "";
           }
         });
         
         document.addEventListener("keydown", (e) => {
           if (e.key === "Escape") {
             lightbox.classList.remove("active");
             lightboxImage.src = "";
           }
         });
      </script>
   </body>
</html>
