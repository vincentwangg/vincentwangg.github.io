<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>VINCENT WANG | Art & Photography</title>
      <link rel="stylesheet" href="css/art_style.css" />
   </head>
   <body>
      <header class="site-header">
         <div class="logo" style="font-weight: 400; letter-spacing: 0.04em">VINCENT WANG</div>
         <nav class="nav">
            <a href="#art">Art</a>
            <a href="#about">About</a>
         </nav>
      </header>
      <main id="home">
         <section class="hero">
            <img src="assets/ballroom-hero.jpg" alt="Featured artwork or photography" />
         </section>
         <section id="art" class="gallery-section">
            <div class="section-head">
               <h2 style="font-weight: 400; letter-spacing: 0.02em">Arachne's Loom</h2>
               <p>Game art</p>
            </div>
            <div class="gallery">
               <div class="gallery-item landscape">
                  <img src="assets/arachnes_loom/main_capsule.png" alt="Artwork 1" data-caption="Key art for game capsule to be displayed on Steam " loading="lazy" />
               </div>
               <div class="gallery-item landscape">
                  <img src="assets/arachnes_loom/chronos.jpg" alt="Artwork 2" data-caption="Splash art for in-game boss, Chronos" loading="lazy" />
               </div>
               <div class="gallery-item landscape">
                  <img src="assets/arachnes_loom/medusa.jpg" alt="Artwork 2" data-caption="Splash art for in-game boss, Medusa" loading="lazy" />
               </div>
               <div class="gallery-item landscape">
                  <img src="assets/art/art4.jpg" alt="Artwork 4" loading="lazy" />
               </div>
               <div class="gallery-item portrait tall">
                  <img src="assets/art/art5.jpg" alt="Artwork 5" loading="lazy" />
               </div>
               <div class="gallery-item landscape wide">
                  <img src="assets/art/art6.jpg" alt="Artwork 6" loading="lazy" />
               </div>
            </div>
         </section>
         <section id="about" class="about">
            <h2>About</h2>
            <p>
               I use this space to share hobby work in art and photography.
               This page is built with simple HTML and CSS for GitHub Pages.
            </p>
         </section>
      </main>
      <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>

        <div class="lightbox-content">
          <img class="lightbox-image" id="lightbox-image" src="" alt="" />
          <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>
      </div>
      <script>
         const lightbox = document.getElementById("lightbox");
         const lightboxImage = document.getElementById("lightbox-image");
         const closeBtn = document.getElementById("lightbox-close");
         const galleryImages = document.querySelectorAll(".gallery-item img");
         const caption = document.getElementById("lightbox-caption");
         
         galleryImages.forEach((img) => {
           img.addEventListener("click", () => {
             lightboxImage.src = img.src;
             lightboxImage.alt = img.alt;
             caption.textContent = img.dataset.caption || "";
             lightbox.classList.add("active");
           });
         });
         
         closeBtn.addEventListener("click", () => {
           lightbox.classList.remove("active");
           lightboxImage.src = "";
           caption.textContent = "";
         });
         
         lightbox.addEventListener("click", (e) => {
           if (e.target === lightbox) {
             lightbox.classList.remove("active");
             lightboxImage.src = "";
           }
         });
         
         document.addEventListener("keydown", (e) => {
           if (e.key === "Escape") {
             lightbox.classList.remove("active");
             lightboxImage.src = "";
           }
         });
      </script>
   </body>
</html>
